/* Макет: жоғарғы жолақ + сол жақ маршрут + мазмұн; үлгі файлдың түстері мен карталарын сақтайды. Бір ғана ашық тақырып. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --ink:#1D2140; --ink-soft:#5B6180; --line:#E4E7F1; --line-strong:#CDD2E3;
  --good:#1D7A41; --good-t:#E6F6EC; --bad:#C9303F; --bad-t:#FFECEE; --warn-t:#FFF6D9;
  --c:#7C5CFF; --d:#5A3FD9; --t:#F1EDFF; --on:#FFFFFF;
  --sans:"Onest",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(29,33,64,.05),0 10px 30px -18px rgba(29,33,64,.28);
  --gx:max(16px,env(safe-area-inset-left,0px)); --gy:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
h1,h2,h3,h4{margin:0;line-height:1.14;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 .8em}
a{color:var(--d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px;border-radius:6px}
main:focus,main:focus-visible{outline:none}
.muted{color:var(--ink-soft)}
.m{font-weight:600;letter-spacing:0}
.m sup,.m sub{font-size:.7em;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .1em;font-size:.88em}
.frac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .14em .06em}
.frac>span:last-child{padding:.06em .14em 0}
.rt{white-space:nowrap}
.rb{border-top:1.5px solid currentColor;padding:0 .08em;margin-left:1px}

/* Жоғарғы жолақ */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:64px;display:flex;align-items:center;gap:14px;padding:0 var(--gy) 0 var(--gx);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#7C5CFF 0 11.11%,#2F7BFF 0 22.22%,#FF5C6C 0 33.33%,#13B8A6 0 44.44%,#FF9A2E 0 55.55%,#E4479C 0 66.66%,#3BB56A 0 77.77%,#F5B700 0 88.88%,#1AA6DD 0)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.2}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.pill:hover{border-color:var(--ink-soft)}

/* Орналасу */
.layout{display:grid;grid-template-columns:276px minmax(0,1fr);max-width:1480px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gy)}
.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px);overflow:auto;padding:26px 14px 26px 0}
.rail h3{font-size:13px;font-weight:700;color:var(--ink-soft);margin:0 10px 10px;letter-spacing:0}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail a{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.25}
.rail a:hover{background:var(--surface)}
.rail a[aria-current="page"]{background:var(--surface);box-shadow:var(--shadow)}
.rail .num{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;font-size:14px;font-weight:800;background:var(--t);color:var(--d)}
.rail a[aria-current="page"] .num,.rail a.done .num{background:var(--c);color:var(--on)}
.rail .min{font-size:12px;color:var(--ink-soft)}
.rail .brk{margin:6px 10px;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.rail .brk::before,.rail .brk::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.rail .extra{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:2px}
.rail .extra a{grid-template-columns:32px 1fr}
.rail .extra .num{background:#EEF0F7;color:var(--ink)}
.rail .prog{margin:16px 10px 0;font-size:13px;color:var(--ink-soft)}
.prog-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;padding:2px 0;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.linkbtn:hover{color:var(--bad);text-decoration-color:currentColor}
.bar{height:7px;border-radius:99px;background:#E9ECF5;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--c);border-radius:inherit;transition:width .5s}
.rail .prog .bar>i{background:linear-gradient(90deg,#7C5CFF,#2F7BFF,#13B8A6,#3BB56A,#F5B700)}
.strip{display:none}
main{min-width:0;padding:30px 0 90px 34px}

/* Басты бет */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:46px;align-items:center;padding:14px 0 6px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tagc{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.tagc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.hero h1{font-size:clamp(34px,4.3vw,56px);line-height:1.04;letter-spacing:-.035em;max-width:14ch}
.hero .sub{font-size:19px;color:var(--ink-soft);margin:20px 0 26px;max-width:54ch}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:146px;padding:16px 16px 14px;border-radius:20px;background:var(--c);color:var(--on);text-decoration:none;overflow:hidden;transition:transform .18s}
.tile:hover{transform:translateY(-3px)}
.tile::after{content:"";position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18)}
.tile .tn{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em}
.tile b{font-size:15.5px;line-height:1.22;font-weight:700;overflow-wrap:anywhere}
.tile small{font-size:12.5px;opacity:.9;font-weight:600}
.tile>span:last-child{line-height:1.25}
.tile .ok{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--d);display:grid;place-items:center;font-weight:800;font-size:14px;z-index:1}
@media (prefers-reduced-motion:no-preference){
  .tile{opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.8,.3,1) forwards}
  .tile:hover{transform:translateY(-3px)}
}
@keyframes rise{to{opacity:1;transform:none}}
.cols3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:18px;margin-top:40px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:24px 26px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:20px;margin-bottom:14px}
.panel .pk{display:inline-block;font-size:13px;font-weight:700;color:var(--d);background:var(--t);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.dots{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dots li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:15.5px;line-height:1.45}
.dots li::before{content:"";width:10px;height:10px;border-radius:3px;margin-top:7px;background:var(--dc,var(--c))}
.refs{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px;line-height:1.45;color:var(--ink-soft)}
.fmt{display:grid;gap:14px}
.fmt>div{padding-left:14px;border-left:3px solid var(--dc)}
.fmt b{display:block;font-size:15.5px}
.fmt p{font-size:14.5px;color:var(--ink-soft);margin:2px 0 0}
.agenda{margin-top:18px;background:var(--surface);border-radius:var(--r-lg);padding:24px 26px;box-shadow:var(--shadow)}
.agenda h3{font-size:20px;margin-bottom:14px}

/* Тапсырма беті */
.task-head{position:relative;overflow:hidden;background:var(--t);border-radius:28px;padding:30px 34px 28px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:end}
.task-head::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--c);opacity:.16}
.task-head::after{content:"";position:absolute;right:120px;bottom:-70px;width:140px;height:140px;border-radius:44px;background:var(--c);opacity:.10;transform:rotate(18deg)}
.task-head>*{position:relative;z-index:1;min-width:0}
.th-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.th-num{display:inline-grid;place-items:center;min-width:52px;height:52px;padding:0 12px;border-radius:16px;background:var(--c);color:var(--on);font-size:24px;font-weight:800;letter-spacing:-.02em}
.th-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.78);font-size:13.5px;font-weight:600;color:var(--ink)}
button.th-chip{border:0;cursor:pointer;font-variant-numeric:tabular-nums}
button.th-chip:hover{background:#fff}
button.th-chip.run{background:var(--d);color:#fff}
.task-head h2{font-size:clamp(28px,3.3vw,42px);letter-spacing:-.03em;max-width:20ch}
.task-head .lead{font-size:17.5px;color:var(--ink-soft);margin:12px 0 0;max-width:62ch}
.outcome{background:var(--surface);border-radius:18px;padding:16px 18px;font-size:14.5px;line-height:1.5;box-shadow:var(--shadow)}
.outcome b{display:block;font-size:13px;color:var(--d);margin-bottom:4px}
.block{margin:22px 0 0;background:var(--surface);border-radius:var(--r-lg);padding:26px 28px;box-shadow:var(--shadow);min-width:0}
.block>h3{font-size:21px;margin-bottom:6px}
.block>.hint{color:var(--ink-soft);font-size:15px;margin-bottom:16px;max-width:72ch}

const CIRC_DATA = {
  sin:[['−1',-6],['−√3/2',-4],['−√2/2',-3],['−1/2',-2],['0',0],['1/2',2],['√2/2',3],['√3/2',4],['1',6],['2',null]],
  cos:[['−1',12],['−√3/2',10],['−√2/2',9],['−1/2',8],['0',6],['1/2',4],['√2/2',3],['√3/2',2],['1',0],['2',null]],
  ctg:[['√3',2],['1',3],['√3/3',4],['0',6],['−√3/3',8],['−1',9],['−√3',10]],
  tg:[['−√3',-4],['−1',-3],['−√3/3',-2],['0',0],['√3/3',2],['1',3],['√3',4]],
};
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const norm24 = n => ((n % 24) + 24) % 24;
const frac12 = n => { if (n === 0) return [0, 1]; const g = gcd(n, 12); return [n / g, 12 / g]; };
const piHTML = n => { const [a, b] = frac12(n); return P(a, b); };
const piPlain = n => { const [a, b] = frac12(n); if (a === 0) return '0'; const s = a < 0 ? '−' : '', x = Math.abs(a), t = x === 1 ? 'π' : x + 'π'; return s + (b === 1 ? t : t + '/' + b); };
function circFormula(fn, n) {
  if (fn === 'sin') {
    if (n === 0) return 'x = πk';
    if (n === 6) return `x = ${P(1,2)} + 2πk`;
    if (n === -6) return `x = −${P(1,2)} + 2πk`;
    return n > 0 ? SG(piHTML(n)) : SGN(piHTML(-n));
  }
  if (fn === 'cos') {
    if (n === 0) return 'x = 2πk';
    if (n === 12) return 'x = π + 2πk';
    if (n === 6) return `x = ${P(1,2)} + πk`;
    return CG(piHTML(n));
  }
  return n === 0 ? 'x = πk' : TG(piHTML(n));  // tg және ctg
}

const CIRC = {fn:'sin', i:5};
const numOf = l => { let s = 1; if (l[0] === '−') { s = -1; l = l.slice(1); } const [t, b] = l.split('/'); const tv = t.startsWith('√') ? Math.sqrt(+t.slice(1)) : +t; return s * tv / (b ? +b : 1); };
function graphRoots(fn, n) {
  const bases = fn === 'sin' ? [n, 12 - n] : fn === 'cos' ? [n, -n] : [n], per = (fn === 'sin' || fn === 'cos') ? 24 : 12, out = new Set();
  bases.forEach(b => { for (let k = -8; k <= 8; k++) { const u = b + per * k; if (u >= -24 && u <= 24) out.add(u); } });
  return [...out].sort((x, y) => x - y);
}
function circSVG(fn, ent) {
  const W = 760, H = 380, L = 44, Rr = 24, T0 = 20, B0 = 50, pw = W - L - Rr, ph = H - T0 - B0;
  const yr = (fn === 'tg' || fn === 'ctg') ? 3.2 : 2.4, n = ent[1], av = numOf(ent[0]);
  const X = u => L + (u + 24) / 48 * pw, Y = v => T0 + ph / 2 - v / yr * ph / 2, f1 = x => x.toFixed(1);
  const f = u => { const t = u * Math.PI / 12; return fn === 'sin' ? Math.sin(t) : fn === 'cos' ? Math.cos(t) : fn === 'tg' ? Math.tan(t) : 1 / Math.tan(t); };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${fn} x функциясының графигі және y = a түзуі"><defs><clipPath id="gclip"><rect x="${L}" y="${T0}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  s += `<rect x="${L}" y="${T0}" width="${pw}" height="${ph}" fill="#fff"/>`;
  for (let u = -24; u <= 24; u += 6) s += `<line x1="${f1(X(u))}" y1="${T0}" x2="${f1(X(u))}" y2="${T0 + ph}" stroke="var(--line)" stroke-width="1"/><text class="svg-s" x="${f1(X(u))}" y="${H - B0 + 20}" text-anchor="middle">${u === 0 ? '0' : piPlain(u)}</text>`;
  const yt = yr > 3 ? [-2, -1, 1, 2] : [-1, 1];
  yt.forEach(v => s += `<line x1="${L}" y1="${f1(Y(v))}" x2="${L + pw}" y2="${f1(Y(v))}" stroke="var(--line)" stroke-width="1"/><text class="svg-s" x="${L - 7}" y="${f1(Y(v) + 4)}" text-anchor="end">${v < 0 ? '−' + (-v) : v}</text>`);
  s += `<line x1="${L}" y1="${f1(Y(0))}" x2="${L + pw}" y2="${f1(Y(0))}" stroke="var(--ink-soft)" stroke-width="1.5"/><line x1="${f1(X(0))}" y1="${T0}" x2="${f1(X(0))}" y2="${T0 + ph}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
  s += `<text class="svg-s" x="${L + pw - 4}" y="${f1(Y(0) - 8)}" text-anchor="end">x</text><text class="svg-s" x="${f1(X(0) + 8)}" y="${T0 + 12}">y</text>`;
  if (fn === 'tg') for (let k = -2; k <= 1; k++) s += `<line x1="${f1(X(6 + 12 * k))}" y1="${T0}" x2="${f1(X(6 + 12 * k))}" y2="${T0 + ph}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 5"/>`;
  if (fn === 'ctg') for (let k = -2; k <= 2; k++) s += `<line x1="${f1(X(12 * k))}" y1="${T0}" x2="${f1(X(12 * k))}" y2="${T0 + ph}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 5"/>`;
  let d = '', prev = null;
  for (let u = -24; u <= 24.001; u += 0.1) {

      <tr><td><b>Барлығы</b></td><td><b>${RUBRIC.reduce((a, r) => a + r[1], 0)}</b></td><td class="l"></td></tr></tbody></table></div></section>

    <section class="block"><h3>Кеңестер</h3><ul class="dots">${TIPS.map(t => `<li>${t}</li>`).join('')}</ul></section>

    <section class="block"><h3>Нәтижені тазалау</h3><p class="hint">Бұл құрылғыдағы жауаптар мен белгілер өшеді. Жаңа студентке құрылғыны бергенде қолданыңыз.</p>
      <div id="resetBox">${resetAsk ? `<div class="confirm"><span>Барлық жауаптар өшсін бе?</span><button type="button" class="btn small ink" data-reset-yes>Иә, тазалау</button><button type="button" class="btn small ghost" data-reset-no>Болдырмау</button></div>` : `<button type="button" class="btn ghost small" data-reset-ask>Барлығын тазалау</button>`}</div></section>
  </article>`,
};

/* ================= Маршрут және оқиғалар ================= */
let CUR = 'home';
function render(keepScroll) {
  const id = CUR, view = V[id], st = STATIONS.find(s => s.id === id);
  const y = window.scrollY;
  $('#view').style.cssText = st ? cvars(st.color) : cvars('violet');
  $('#view').innerHTML = view.html();
  if (view.mount) view.mount();
  if (keepScroll) window.scrollTo(0, y);
}
function route() {
  const h = (location.hash || '#home').slice(1);
  CUR = V[h] ? h : 'home';
  stopTimer(); resetAsk = false;
  render(false);
  renderNav(CUR);
  const st = STATIONS.find(s => s.id === CUR); if (st) initTimer(st.min);
  window.scrollTo(0, 0);
  if (CUR === 's8') updateTestMsg();
}
function updateTestMsg() {
  const el = $('#testMsg'); if (!el) return;
  const a = answeredCount('t', TEST), c = correctCount('t', TEST);
  if (a === TEST.length && !UNL) { el.innerHTML = '<div class="feedback-msg wait" style="margin:16px 0 0"><b>Тест аяқталды.</b> Нәтиже оқытушы рұқсат бергенде көрінеді.</div>'; return; }
  el.innerHTML = a === TEST.length ? `<div class="feedback-msg ${c >= 6 ? 'good' : 'bad'}" style="margin:16px 0 0"><b>Нәтиже: ${c} / ${TEST.length}.</b> ${c >= 7 ? 'Тамаша, тақырыпты жақсы меңгердіңіз.' : c >= 5 ? 'Жақсы. Қателескен сұрақтарды қайта қарап шығыңыз.' : 'Теория бөлімдерін (2 және 4) қайталап, 3-тапсырмаға оралыңыз.'}</div>` : '';
}
document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('.opt[data-id]')) && !el.disabled) { answer(el.dataset.id, +el.dataset.j); if (CUR === 's8') updateTestMsg(); return; }
  if ((el = t.closest('[data-retry]'))) { const p = el.dataset.retry; Object.keys(S.ans).forEach(k => { if (k.startsWith(p + ':')) delete S.ans[k]; }); save(); render(true); if (CUR === 's8') updateTestMsg(); return; }
  if ((el = t.closest('[data-finish]'))) { S.done[el.dataset.finish] = true; save(); const st = STATIONS.find(s => s.id === el.dataset.finish); $('.st-foot').innerHTML = footHTML(st); renderNav(CUR); toast('Тапсырма аяқталды'); return; }
  if (t.closest('#tmBtn')) { toggleTimer(); return; }
  if ((el = t.closest('[data-cfn]'))) { CIRC.fn = el.dataset.cfn; CIRC.i = CIRC_DATA[CIRC.fn].findIndex(x => x[0] === (CIRC.fn === 'tg' || CIRC.fn === 'ctg' ? '1' : '1/2')); $('#circBox').innerHTML = circUI(); return; }
  if ((el = t.closest('[data-ci]'))) { CIRC.i = +el.dataset.ci; $('#circBox').innerHTML = circUI(); return; }
  if ((el = t.closest('[data-gtab]'))) { S.g5 = el.dataset.gtab; save(); render(true); return; }
  if ((el = t.closest('[data-p7]'))) { S.p7 = el.dataset.p7; save(); render(true); return; }
  if ((el = t.closest('[data-v6]'))) { S.v6 = +el.dataset.v6; save(); render(true); return; }
  if ((el = t.closest('[data-scale]'))) { S[el.dataset.scale] = +el.dataset.v; save(); document.querySelectorAll(`[data-scale="${el.dataset.scale}"]`).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S[el.dataset.scale]))); updateSelf(); return; }
  if ((el = t.closest('[data-rate]'))) { S.rate = +el.dataset.rate; save(); document.querySelectorAll('[data-rate]').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.rate === S.rate))); return; }
  if (t.closest('[data-reset-ask]')) { resetAsk = true; render(true); return; }
  if (t.closest('[data-reset-no]')) { resetAsk = false; render(true); return; }
  if (t.closest('[data-reset-yes]')) { S = DEF(); save(); resetAsk = false; render(true); renderNav(CUR); toast('Нәтижелер тазаланды'); return; }
  if ((el = t.closest('[data-scroll]'))) { e.preventDefault(); const x = document.getElementById(el.dataset.scroll); if (x) x.scrollIntoView({behavior:'smooth'}); return; }
});
document.addEventListener('change', e => {
  const c = e.target;
  if (c.dataset && c.dataset.ck) { S.check[c.dataset.ck] = c.checked; save(); c.closest('.ck').classList.toggle('on', c.checked); const sc = $('#ckScore'); if (sc) sc.innerHTML = ckScore(); }
  else if (c.dataset && c.dataset.cando != null) { S.cando[c.dataset.cando] = c.checked; save(); c.closest('.ck').classList.toggle('on', c.checked); }
});
document.addEventListener('input', e => {
  const c = e.target;
  if (c.id === 'nm') { S.name = c.value; save(); }
  else if (c.dataset && c.dataset.ref) { S.reflect[c.dataset.ref] = c.value; save(); }
});
function paintLock() {
  const b = $('#lockBtn'); if (!b) return;
  b.innerHTML = `<span style="width:9px;height:9px;border-radius:50%;background:${UNL ? '#3BB56A' : '#F5B700'}"></span>Жауаптар: ${UNL ? 'ашық' : 'жабық'}`;
  b.title = UNL ? 'Жауаптарды қайта жабу' : 'Оқытушы коды арқылы ашу';
}
function setUnl(v) {
  UNL = v; try { sessionStorage.setItem('trig-unl', v ? '1' : '0'); } catch (e) {}
  paintLock(); $('#lockPop').hidden = true; render(true); renderNav(CUR); if (CUR === 's8') updateTestMsg();
  toast(v ? 'Жауаптар ашылды' : 'Жауаптар жабылды');
}
function tryCode() { const i = $('#lockIn'); if (i.value.trim() === TEACH_CODE) { i.value = ''; $('#lockErr').textContent = ''; setUnl(true); } else $('#lockErr').textContent = 'Код дұрыс емес.'; }
document.addEventListener('click', e => {
  if (e.target.closest('#lockBtn')) { if (UNL) setUnl(false); else { const p = $('#lockPop'); p.hidden = !p.hidden; if (!p.hidden) $('#lockIn').focus(); } }
  else if (e.target.closest('#lockGo')) tryCode();
  else if (e.target.closest('[data-lockopen]')) { $('#lockPop').hidden = false; $('#lockIn').focus(); }
});
document.addEventListener('keydown', e => { if (e.target.id === 'lockIn' && e.key === 'Enter') tryCode(); if (e.key === 'Escape') $('#lockPop').hidden = true; });
window.addEventListener('hashchange', route);
paintLock();
route();

</script>

</body></html>
